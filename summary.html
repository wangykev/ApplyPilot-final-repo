<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ApplyPilot — Review summary</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #f7f8fa;
        --line: #e8eaf0;
        --line-strong: #ccd1dc;
        --ink: #1b1e26;
        --ink-2: #444b5a;
        --muted: #717890;
        --muted-2: #9aa0b2;
        --accent: #4338ca;
        --accent-weak: #edecfb;
        --accent-ink: #322ba0;
        --ok: #1a7f48;
        --warn: #b25408; --warn-tint: #fdf7f0;
        --edit: #1c52a0; --edit-tint: #f1f5fc;
        --skip: #828a99;
        --crit: #b00020; --crit-tint: #fdf4f5;
        --eeo: #7a3ea3;
        --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: "Cascadia Code", "Segoe UI Mono", ui-monospace, Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      body { font-family: var(--sans); background: var(--bg); color: var(--ink); margin: 0; line-height: 1.35; font-size: 13px; -webkit-font-smoothing: antialiased; }
      .app { max-width: 1080px; margin: 0 auto; padding: 14px 16px 56px; }
      button { font-family: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

      /* header */
      .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .logo { width: 22px; height: 22px; border-radius: 6px; flex: none; background: linear-gradient(150deg, #4f46e5, #312e81); display: grid; place-items: center; color: #fff; font-size: 12px; }
      .title { font-size: 15px; font-weight: 660; letter-spacing: -.01em; white-space: nowrap; }
      .meta { font-size: 11.5px; color: var(--muted); }
      .meta .d { color: var(--muted-2); margin: 0 5px; }
      .toolbar { display: flex; gap: 4px; }
      .tbtn { appearance: none; border: none; background: transparent; color: var(--muted); font-size: 11.5px; padding: 4px 7px; border-radius: 5px; cursor: pointer; }
      .tbtn:hover { background: #e9ebf0; color: var(--ink-2); }

      /* summary + filter strip */
      .bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 11px 0 12px; }
      .fl { appearance: none; border: none; background: transparent; color: var(--ink-2); font-size: 12.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
      .fl:hover { background: #e9ebf0; }
      .fl .n { font-weight: 700; font-variant-numeric: tabular-nums; }
      .fl .gl { width: 7px; height: 7px; border-radius: 50%; }
      .fl[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent-ink); }
      .gl.warn { background: var(--warn); } .gl.edit { background: var(--edit); }
      .bar .info { font-size: 11.5px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
      .bar .info b { color: var(--ink-2); font-weight: 650; }

      /* submit-blocked */
      .submit-blocked { display: flex; gap: 8px; align-items: baseline; background: var(--crit-tint); border: 1px solid #f0c7ce; color: var(--crit); border-radius: 7px; padding: 8px 11px; margin-bottom: 11px; font-size: 12.5px; }
      .submit-blocked b { font-weight: 700; }
      .submit-blocked .s { color: #8a2230; }

      /* block label */
      .blab { display: flex; align-items: center; gap: 8px; margin: 13px 0 5px; }
      .blab h2 { font-size: 11px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
      .blab .ct { font-size: 11px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
      .blab .rule { flex: 1; height: 1px; background: var(--line); }
      .pgcap { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); margin: 13px 0 4px; }

      /* the table */
      .tbl { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); margin-bottom: 8px; }
      .tbl.review { border-color: #efd3b4; }
      .grp { border-top: 1px solid var(--line); }
      .tbl > .grp:first-child { border-top: none; }
      .ghead { appearance: none; width: 100%; border: none; background: var(--surface-2); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 10px; text-align: left; font-family: inherit; }
      .ghead:hover { background: #eef0f4; }
      .review .ghead { background: var(--warn-tint); }
      .chev { width: 11px; font-size: 10px; color: var(--muted-2); transition: transform .14s; flex: none; }
      .grp.collapsed .chev { transform: rotate(-90deg); }
      .gname { font-size: 12px; font-weight: 640; color: var(--ink); }
      .gcount { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .gdots { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
      .pdot { width: 6px; height: 6px; border-radius: 50%; }
      .pdot.ok { background: var(--ok); } .pdot.warn { background: var(--warn); } .pdot.crit { background: var(--crit); } .pdot.skip { background: var(--line-strong); }
      .pdot-l { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 1px; }
      .gbody { }
      .grp.collapsed .gbody { display: none; }
      .edivider { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-2); padding: 5px 10px 2px 28px; }
      /* repeating-entry header (with a per-entry delete, like the form) */
      .ehead { display: flex; align-items: center; gap: 8px; padding: 5px 10px 2px 28px; }
      .ehead .et { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-2); }
      .del { margin-left: auto; appearance: none; border: 1px solid transparent; background: transparent; color: var(--muted-2); border-radius: 5px; padding: 2px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; line-height: 1; }
      .del:hover { color: var(--crit); background: var(--crit-tint); border-color: #f0c7ce; }
      .del svg { display: block; }
      .edel { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 28px; font-size: 11px; color: var(--muted); background: var(--surface-2); border-top: 1px solid var(--line); }
      .edel .undo { appearance: none; border: none; background: none; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 560; padding: 0; }
      .edel .undo:hover { text-decoration: underline; }
      .edel s { color: var(--muted-2); }

      /* rows */
      .row { display: grid; grid-template-columns: minmax(120px, .82fr) minmax(210px, 1.5fr) 16px; gap: 2px 12px; padding: 3px 10px 3px 28px; border-top: 1px solid var(--line); align-items: center; }
      .gbody > .row:first-child { border-top: none; }
      .edivider + .row { border-top: none; }
      .row.f-warn { box-shadow: inset 3px 0 0 var(--warn); background: var(--warn-tint); }
      .row.f-crit { box-shadow: inset 3px 0 0 var(--crit); background: var(--crit-tint); }
      .row.f-edit { box-shadow: inset 3px 0 0 var(--edit); background: var(--edit-tint); }
      .lab { font-size: 12px; color: var(--ink-2); display: flex; gap: 5px; align-items: baseline; flex-wrap: wrap; line-height: 1.3; }
      .lab .req { color: var(--crit); font-weight: 700; }
      .lab .lb { font-size: 9px; font-weight: 700; letter-spacing: .02em; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
      .lb.crit { background: var(--crit); color: #fff; } .lb.eeo { background: var(--eeo); color: #fff; } .lb.ai { background: var(--edit-tint); color: var(--edit); }
      .lb.superhard { background: #7a0016; color: #fff; font-weight: 800; } /* AI-forced / low-confidence AI — loudest, above legally-loaded */
      .val { min-width: 0; }
      .afref { font-size: 10.5px; color: var(--edit); margin-top: 1px; }
      .afref:empty { display: none; }
      .afref b { font-weight: 600; }
      .partial-note { font-size: 10px; color: var(--warn); margin-top: 1px; }
      .reason { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin: 1px 0 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .jump { appearance: none; border: none; background: transparent; color: var(--accent); font-size: 11px; font-weight: 560; cursor: pointer; padding: 0; white-space: nowrap; }
      .jump:hover { text-decoration: underline; }

      /* status dot */
      .dot { width: 9px; height: 9px; border-radius: 50%; justify-self: center; flex: none; }
      .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.skip { background: var(--line-strong); }

      /* in-place editors: a faint persistent box (obviously editable) that firms up on hover/focus */
      .editor { font-family: inherit; font-size: 12px; padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); width: 100%; max-width: 340px; }
      .editor:hover { border-color: var(--line-strong); }
      .editor:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-weak); }
      select.editor { cursor: pointer; }
      textarea.editor { resize: vertical; min-height: 24px; line-height: 1.3; display: block; }
      .editor-check { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; margin: 1px 0; }
      .static { font-size: 12px; word-break: break-word; }
      .static.empty { color: var(--muted-2); font-style: italic; }
      .ta-wrap { position: relative; max-width: 340px; }
      .ta-list { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 210px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 6px 18px rgba(20,24,40,.12); }
      .ta-opt { padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
      .ta-opt:hover { background: var(--accent-weak); }
      .ta-opt.sel { font-weight: 650; background: var(--accent-weak); color: var(--accent-ink); }
      .ta-clear { font-style: italic; color: var(--muted); border-bottom: 1px solid var(--line); }

      .empty { color: var(--muted); font-size: 13px; padding: 44px 0; text-align: center; }

      @media (max-width: 600px) {
        .row { grid-template-columns: 1fr 16px; }
        .row .val { grid-column: 1 / -1; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="app"><div id="root"></div></div>
    <script src="summary.js"></script>
  </body>
</html>
