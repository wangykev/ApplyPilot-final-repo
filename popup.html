<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; }
      button { display: block; width: 100%; margin: 0 0 8px; padding: 8px; cursor: pointer; }
      label { display: block; font-size: 12px; margin-top: 4px; }
      input { width: 100%; box-sizing: border-box; margin: 4px 0 6px; padding: 6px; }
      hr { margin: 10px 0; border: none; border-top: 1px solid #ddd; }
      #status { font-size: 12px; color: #333; white-space: pre-wrap; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <button id="load-profile">Load default profile</button>
    <button id="fill-page">Fill current page</button>
    <button id="walk-pages">Fill 2 pages (walk)</button>
    <button id="view-summary">View last summary</button>
    <hr>
    <!-- Store ONE resume (PDF) in IndexedDB. Fill (current page / walk) attaches it
         automatically on the page that has the upload widget (M16.3). -->
    <label for="resume-file">Resume (PDF) — stored in the extension:</label>
    <input id="resume-file" type="file" accept="application/pdf,.pdf">
    <div id="resume-status">Saved resume: none</div>
    <hr>
    <!-- CDP RECON (Step 1 of the CDP actuation port): probe what chrome.debugger
         INPUT can do to a HIDDEN tab — insertText vs per-char keys, mouse vs
         keyboard commits, rect validity, commit latencies. Click, then MINIMIZE
         within 60s; probes start on the first hidden read. Findings land in the
         SERVICE-WORKER console ([CDP-RECON] lines + one summary JSON). Keep page
         DevTools CLOSED on the tab — a second debugger client kills the attach. -->
    <button id="cdp-recon">CDP recon: simple widgets (minimize!)</button>
    <!-- CDP FILL (Step 2): fill this page's text/dropdown/radio/checkbox fields via
         chrome.debugger input while the tab is HIDDEN. Load the profile (+ company)
         first, click, then MINIMIZE within 60s. Typeahead/source are deferred →
         NEEDS REVIEW; repeating sections untouched. Results in the SW console. -->
    <button id="cdp-fill">CDP fill (hidden): simple widgets</button>
    <!-- CDP WALK (M31): fill page 1, then a GUARDED Save & Continue with VPS/session
         detection — halts "session expired" on a dead session, reports "advanced" on a
         clean transition (page-2 fill deferred). NOTE: on a LIVE session this advances
         the application to page 2. Minimize within 60s; [CDP-WALK] in the SW console. -->
    <button id="cdp-walk">CDP fill + advance / session check (minimize!)</button>
    <!-- Label/field regex for "CDP fill one date" below (the remaining fill-one harness). -->
    <label for="ta-label">CDP fill-one target (label/field regex):</label>
    <input id="ta-label" type="text" placeholder="e.g. issuedDate">
    <!-- SESSION RECON (M30 Step 0): read-only snapshot to find the signal that tells a
         live apply form from a logged-out/expired state. NO minimize needed. Run once
         on a VALID form and once LOGGED-OUT/stale; paste both [SESSION-RECON] blocks. -->
    <button id="cdp-session-recon">CDP recon: session state (no minimize)</button>
    <!-- SOURCE FILL (backlog C — Phase B): fill the "How did you hear about us?" picker
         via the typeahead-style source brain HIDDEN, candidates from
         defaults.how_did_you_hear (preferred LinkedIn). Minimize within 60s; [CDP-SRC]
         in the SW console. -->
    <button id="cdp-source-fill">CDP fill source: LinkedIn (minimize!)</button>
    <!-- REPEATING-SECTION RECON (M32 Step 0): the FIRST step of porting page-2
         (My Experience) repeating sections to CDP. Read-only structure dump
         (sections present, entries, per-entry fields, Add/Delete rects) + a
         Websites shape check + one bounded DATE-SPINBUTTON probe (the key
         unknown — CDP has no native setter). Run on My Experience (page 2);
         minimize within 60s (the date probe actuates one segment, restored
         after). [REPEAT-RECON] in the SW console. -->
    <button id="cdp-repeat-recon">CDP recon: repeating sections (minimize!)</button>
    <!-- CERT-SPECIALTY RECON (M36.2): read-mostly discovery of the NESTED Specialties
         sub-section inside a Certification entry (a repeating section within a repeating
         entry). Mounts ONE specialty, dumps the data-fkit-id + field diff (the specialty
         container prefix + per-specialty typeahead/start-end dates + Attachments presence),
         then restores. Run on My Experience (page 2); minimize within 60s.
         [CERT-SPECIALTY-RECON] in the SW console. -->
    <button id="cdp-cert-specialty-recon">CDP recon: cert specialties (page 2; minimize!)</button>
    <!-- TEXTAREA RECON (M37 Part 0 — the WE gate): does CDP actuation drive a Workday
         <textarea>? Probes the Work Experience roleDescription textarea with a MULTI-LINE
         value (insertText vs native-setter), confirming the newline survives + React
         survival. Run on My Experience (page 2) with ≥1 WE entry; minimize within 60s.
         [TEXTAREA-RECON] in the SW console. -->
    <button id="cdp-textarea-recon">CDP recon: WE textarea (page 2; minimize!)</button>
    <!-- WEBSITES FILL (M32b): the FIRST repeating-section fill on the CDP path —
         reconcile the Websites section to N + fill each entry's url (date-free; the
         section the M32 recon flagged as the clean machinery proof). Run on My
         Experience (page 2); minimize within 60s. [CDP-WEB] in the SW console. -->
    <button id="cdp-fill-websites">CDP fill websites (page 2; minimize!)</button>
    <!-- LANGUAGES FILL (M35): reuse the repeating-section driver for the date-free Languages
         section (language + by-label proficiency dropdowns + "I am fluent" checkbox; deleteOnNoMatch).
         First live exercise of the labelRegex/hashed-id resolve. Run on My Experience (page 2);
         minimize within 60s. [CDP-LANG] in the SW console. -->
    <button id="cdp-fill-languages">CDP fill languages (page 2; minimize!)</button>
    <!-- EDUCATION FILL (M36): reuse the repeating-section driver for Education — school/degree/
         fieldOfStudy/GPA + from/to YEAR dates (un-deferred date branch). Run on My Experience
         (page 2); minimize within 60s. [CDP-EDU] in the SW console. -->
    <button id="cdp-fill-education">CDP fill education (page 2; minimize!)</button>
    <!-- CERTIFICATIONS FILL (M36): cert typeahead + number + issued/expiration M/D/Y dates
         (un-deferred date branch). deleteOnNoMatch. Set a REAL cert name to see the M/D/Y dates
         render in-section. Run on My Experience (page 2); minimize within 60s. [CDP-CERT]. -->
    <button id="cdp-fill-certifications">CDP fill certifications (page 2; minimize!)</button>
    <!-- DATE FILL (M34 verify): fill ONE date composite located by the label regex
         above (reuses the "CDP typeahead target" input) via fillDateCompositeCdp —
         proves the date handler on WE M/Y, Education year-only, Certs M/D/Y. Run on
         My Experience (page 2); minimize within 60s. [CDP-DATE] in the SW console. -->
    <button id="cdp-fill-date">CDP fill one date (page 2; minimize!)</button>
    <hr>
    <!-- TEMPORARY: per-posting company. Later the JD-page extraction writes jobContext. -->
    <label for="company">Company for this application (temporary):</label>
    <input id="company" type="text" placeholder="e.g. Cambium Learning">
    <button id="set-company">Set company</button>
    <div id="status"></div>
    <script src="db.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
