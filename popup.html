<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; }
      button { display: block; width: 100%; margin: 0 0 8px; padding: 8px; cursor: pointer; }
      label { display: block; font-size: 12px; margin-top: 4px; }
      input { width: 100%; box-sizing: border-box; margin: 4px 0 6px; padding: 6px; }
      hr { margin: 10px 0; border: none; border-top: 1px solid #ddd; }
      #status { font-size: 12px; color: #333; white-space: pre-wrap; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <button id="load-profile">Load default profile</button>
    <button id="fill-page">Fill current page</button>
    <button id="walk-pages">Fill 2 pages (walk)</button>
    <button id="view-summary">View last summary</button>
    <hr>
    <!-- Store ONE resume (PDF) in IndexedDB. Fill (current page / walk) attaches it
         automatically on the page that has the upload widget (M16.3). -->
    <label for="resume-file">Resume (PDF) — stored in the extension:</label>
    <input id="resume-file" type="file" accept="application/pdf,.pdf">
    <div id="resume-status">Saved resume: none</div>
    <hr>
    <!-- CDP RECON (Step 1 of the CDP actuation port): probe what chrome.debugger
         INPUT can do to a HIDDEN tab — insertText vs per-char keys, mouse vs
         keyboard commits, rect validity, commit latencies. Click, then MINIMIZE
         within 60s; probes start on the first hidden read. Findings land in the
         SERVICE-WORKER console ([CDP-RECON] lines + one summary JSON). Keep page
         DevTools CLOSED on the tab — a second debugger client kills the attach. -->
    <button id="cdp-recon">CDP recon: simple widgets (minimize!)</button>
    <!-- CDP FILL (Step 2): fill this page's text/dropdown/radio/checkbox fields via
         chrome.debugger input while the tab is HIDDEN. Load the profile (+ company)
         first, click, then MINIMIZE within 60s. Typeahead/source are deferred →
         NEEDS REVIEW; repeating sections untouched. Results in the SW console. -->
    <button id="cdp-fill">CDP fill (hidden): simple widgets</button>
    <!-- TYPEAHEAD RECON (M25 Step 1): probe ONE chipless typeahead hidden — filter
         trigger, settle timing, keyboard commit + chip signal, no-match banner,
         option-scope (aria-controls vs page-wide). Run on My Experience (Field of
         Study virgin → ends holding "Other", the desired value) and once on My
         Information (pre-filled countryPhoneCode is reported read-only). Minimize
         within 60s; results land in the SW console as [TA-RECON]. -->
    <button id="cdp-ta-recon">CDP recon: typeahead (minimize!)</button>
    <!-- M25 verify harness: fill ONE typeahead (matched by label regex) through the
         CDP brain while hidden — reaches entry fields (Field of Study, Certification)
         without the multi-entry machinery. Minimize within 60s; [CDP-TA] in SW console. -->
    <label for="ta-label">CDP typeahead target (label regex):</label>
    <input id="ta-label" type="text" placeholder="e.g. Field of Study">
    <button id="cdp-fill-ta">CDP fill one typeahead (minimize!)</button>
    <!-- OVERWRITE RECON (M27 Step 0): probe the populated-field model. HAND-SEED a
         WRONG value into a typeahead (e.g. countryPhoneCode) FIRST, then click and
         minimize within 60s. Confirms searchBox-while-populated, that clearSearch
         keeps the chip, and whether a commit REPLACES vs ADDS a chip (the latter
         decides if residual-chip cleanup is needed). [OVR-RECON] in the SW console. -->
    <button id="cdp-overwrite-recon">CDP recon: overwrite model (minimize!)</button>
    <!-- SOURCE OVERWRITE RECON (M27 Step 0, source half): prove clearSourceSearch
         keeps a seeded source chip. HAND-SEED a value into "How did you hear about
         us?" first, then click and minimize within 60s. [OVR-SRC-RECON] in the SW
         console. The (a2) result gates Commit B's source no-match path. -->
    <button id="cdp-source-overwrite-recon">CDP recon: source overwrite (minimize!)</button>
    <!-- SESSION RECON (M30 Step 0): read-only snapshot to find the signal that tells a
         live apply form from a logged-out/expired state. NO minimize needed. Run once
         on a VALID form and once LOGGED-OUT/stale; paste both [SESSION-RECON] blocks. -->
    <button id="cdp-session-recon">CDP recon: session state (no minimize)</button>
    <!-- SOURCE RECON (tree picker, backlog C — Phase A, MAP ONLY, no commit): on My
         Information, characterize the "How did you hear about us?" hierarchical picker
         hidden — opens, maps the tree, locates LinkedIn, tests the expand mechanism,
         reads commit-signal attributes. Never selects a leaf. Minimize within 60s;
         [CDP-SRC-RECON] in the SW console. -->
    <button id="cdp-source-recon">CDP recon: source map (minimize!)</button>
    <!-- SOURCE FILL (backlog C — Phase B): fill the "How did you hear about us?" picker
         via the typeahead-style source brain HIDDEN, candidates from
         defaults.how_did_you_hear (preferred LinkedIn). Minimize within 60s; [CDP-SRC]
         in the SW console. -->
    <button id="cdp-source-fill">CDP fill source: LinkedIn (minimize!)</button>
    <hr>
    <!-- TEMPORARY: per-posting company. Later the JD-page extraction writes jobContext. -->
    <label for="company">Company for this application (temporary):</label>
    <input id="company" type="text" placeholder="e.g. Cambium Learning">
    <button id="set-company">Set company</button>
    <div id="status"></div>
    <script src="db.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
